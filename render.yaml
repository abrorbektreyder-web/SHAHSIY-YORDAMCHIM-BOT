services:
  - type: web
    name: vazifa-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MODE
        value: webhook
      - key: DB_SCHEMA
        value: vazifa
      - key: LLM_PROVIDER
        value: groq
      - key: STT_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
